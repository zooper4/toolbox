name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"] # 监听 main 分支的推送
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout源码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖并编译
        run: |
          npm install
          npm run build  # 确保你的 package.json 中有 build 命令
      - name: 配置 Pages
        uses: actions/configure-pages@v4
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 这里的路径要和编译生成的文件夹一致（如 dist 或 build）
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
